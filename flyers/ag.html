<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aira — Announcement</title>
<link rel="stylesheet" href="brand.css">
<style>
  .ag { display:flex; flex-direction:column; justify-content:space-between; min-height:calc(100vh - 112px); }
  .ag-pill { align-self:flex-start; }
  .ag-main { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .ag-main .eyebrow { letter-spacing:4px; font-weight:800; color:var(--brand-deep); text-transform:uppercase; font-size:14px; }
  .ag-main h1 { font-size:96px; letter-spacing:-3px; margin-top:18px; line-height:.98; }
  .ag-main h1 em { font-style:normal; color:var(--brand); white-space:nowrap; }
  .ag-foot { display:flex; align-items:center; justify-content:space-between; gap:22px; }
</style>
</head>
<body>
<div class="flyer">
  <div class="ag">
    <header class="ag-pill">
      <div class="chip">● TASKS DONE, NOT TYPED</div>
    </header>
    <div class="ag-main">
      <div class="eyebrow">Announcing</div>
      <h1>Meet your<br>new AI<br><em>chief of staff.</em></h1>
    </div>
    <div class="ag-foot">
      <div class="logo">
        <span class="logo-mark">A</span>
        <div>
          <div class="logo-word" style="font-size:26px">Aira</div>
          <div class="logo-tag" style="font-size:14px">Your AI chief of staff · TaskVeda</div>
        </div>
      </div>
      <span class="sub" style="max-width:340px;text-align:right">Slack, voice &amp; on your Mac — delegating to your team has never been this literal.</span>
    </div>
  </div>
</div>
</body>
</html>
