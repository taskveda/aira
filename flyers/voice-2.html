<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aira — Hey Aira (voice 2)</title>
<link rel="stylesheet" href="brand.css">
<style>
  .v2 { display:flex; flex-direction:column; justify-content:space-between; min-height:calc(100vh - 112px); }
  .v2-top { display:flex; align-items:center; justify-content:space-between; }
  .v2-hero { flex:1; display:flex; align-items:center; justify-content:center; gap:60px; }
  .v2-wave { position:relative; width:180px; height:180px; }
  .v2-wave .ring { position:absolute; border-radius:50%; border:2px solid var(--brand); top:50%; left:50%; transform:translate(-50%,-50%); }
  .r1{width:120px;height:120px;animation:w1 1.6s infinite}
  .r2{width:180px;height:180px;animation:w2 1.6s infinite}
  .r3{width:240px;height:240px;animation:w3 1.6s infinite}
  @keyframes w1{0%{opacity:.9}100%{opacity:.1;transform:translate(-50%,-50%) scale(1.6)}}
  @keyframes w2{0%{opacity:.6}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
  @keyframes w3{0%{opacity:.4}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
  .core { position:absolute; width:104px; height:104px; top:50%; left:50%; transform:translate(-50%,-50%); border-radius:50%; background:conic-gradient(from 200deg, var(--brand), var(--accent), var(--brand)); box-shadow:0 20px 60px rgba(79,124,255,.5); }
  .waveline { display:flex; align-items:baseline; gap:5px; }
  .bar { width:9px; background:var(--brand); border-radius:99px; animation:eq 1.1s ease-in-out infinite; }
  .b1{height:26px}.b2{height:52px;animation-delay:.1s}.b3{height:84px;animation-delay:.2s}.b4{height:120px;animation-delay:.3s}.b5{height:84px;animation-delay:.4s}.b6{height:52px;animation-delay:.5s}.b7{height:26px;animation-delay:.6s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .v2-copy { max-width:420px; }
  .v2-copy h1 { font-size:64px; }
  .v2-copy h1 em { font-style:normal; color:var(--brand); }
  .v2-copy p { margin-top:18px; font-size:17px; }
  .v2-copy .big-word { margin-top:22px; font-size:40px; font-weight:800; letter-spacing:-1px; display:flex; align-items:center; gap:18px; }
</style>
</head>
<body>
<div class="flyer">
  <div class="v2">
    <div class="v2-top">
      <div class="logo">
        <span class="logo-mark">A</span>
        <div><div class="logo-word">Aira</div><div class="logo-tag">Your AI chief of staff</div></div>
      </div>
      <span class="kicker">Always listening · works out loud</span>
    </div>

    <div class="v2-hero">
      <div class="v2-wave">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <div class="core"></div>
      </div>
      <div>
        <div class="big-word">"Yes, Rohit?"</div>
        <div class="waveline" style="margin-top:24px">
          <span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span><span class="bar b4"></span><span class="bar b5"></span><span class="bar b6"></span><span class="bar b7"></span>
        </div>
      </div>
      <div class="v2-copy">
        <h1>Wake to <em>work.</em></h1>
        <p class="sub">Say <b>"Hey Aira"</b> and it answers like Siri — then listens for your task and gets it done aloud.</p>
      </div>
    </div>

    <footer class="foot"><span>TaskVeda × Aira — Your AI chief of staff</span></footer>
  </div>
</div>
</body>
</html>
