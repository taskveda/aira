<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aira — Instagram square</title>
<link rel="stylesheet" href="brand.css">
<style>
  .ig { width:1080px; height:1080px; min-height:0; display:flex; flex-direction:column; justify-content:space-between; }
  .ig .top { display:flex; align-items:center; justify-content:space-between; }
  .ig .big { text-align:center; }
  .ig .big h1 { font-size:120px; letter-spacing:-2.5px; }
  .ig .big h1 em { font-style:normal; color:var(--brand); }
  .ig .big p { font-size:30px; color:var(--ink-soft); margin-top:20px; }
  .ig .chips { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .ig .chips .chip { font-size:22px; padding:14px 26px; }
  .foot-mini { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:800; }
</style>
</head>
<body>
<div class="flyer ig">
  <div class="top">
    <div class="logo">
      <span class="logo-mark">A</span>
      <div>
        <div class="logo-word" style="font-size:26px">Aira</div>
        <div class="logo-tag" style="font-size:15px">Your AI chief of staff</div>
      </div>
    </div>
    <span class="kicker" style="font-size:16px">@taskveda</span>
  </div>

  <div class="big">
    <h1>Say <em>"Hey Aira"</em></h1>
    <p>Your AI chief of staff. Listens, speaks &amp; gets work done.</p>
  </div>

  <div class="chips">
    <span class="chip">Voice</span>
    <span class="chip">Email</span>
    <span class="chip">Research</span>
    <span class="chip">Files</span>
  </div>

  <div class="foot-mini">A</div>
</div>
</body>
</html>
