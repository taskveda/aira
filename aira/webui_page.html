<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Aira — your AI assistant. Write, explain, code and summarize, all in one place.">
<title>Aira — AI Assistant</title>
<style>
:root{
  --bg:#0b0d14; --bg2:#0f1220; --panel:#151926; --panel2:#1a2033; --line:#242c44;
  --ink:#f2f4fa; --muted:#9aa3bc; --faint:#5d6988;
  --brand:#5b8cff; --brand2:#9a5bff; --pink:#ff7ab8;
  --ok:#3ddb94; --no:#ff7b7b; --warn:#f0b34d;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  --ring:0 0 0 1px rgba(120,140,220,.14);
  --grad:linear-gradient(135deg,var(--brand),var(--brand2));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(900px 500px at 50% -10%,rgba(91,140,255,.14),transparent 60%),
    radial-gradient(700px 460px at 92% 108%,rgba(154,91,255,.10),transparent 60%),
    radial-gradient(640px 420px at 4% 104%,rgba(255,122,184,.08),transparent 60%),
    var(--bg);
  color:var(--ink);display:flex;flex-direction:column;min-height:100vh;
  -webkit-font-smoothing:antialiased;letter-spacing:-.1px;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:color-mix(in srgb,var(--brand) 40%,transparent)}

/* ===== top bar ===== */
header{display:flex;align-items:center;gap:12px;padding:20px 30px;max-width:960px;width:100%;margin:0 auto}
.orb{width:34px;height:34px;border-radius:50%;flex-shrink:0;position:relative;
  background:radial-gradient(circle at 34% 28%,#dbe6ff,var(--brand) 46%,var(--brand2) 78%,var(--pink));
  box-shadow:0 8px 24px rgba(91,140,255,.35)}
.brand b{font-size:17px;font-weight:750}
.brand span{display:block;font-size:12.5px;color:var(--muted);margin-top:-2px}
.spacer{flex:1}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.03);
  padding:6px 12px;border-radius:99px}
.badge b{color:var(--ink)}

/* ===== main chat area ===== */
main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:0 30px;display:flex;flex-direction:column;
  align-items:center;min-height:0}

/* hero (no messages yet) */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px 0;animation:fade .5s;width:100%}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.hero .bigorb{width:84px;height:84px;border-radius:50%;margin:0 auto 26px;position:relative;
  background:radial-gradient(circle at 34% 28%,#eef3ff,var(--brand) 42%,var(--brand2) 76%,var(--pink) 112%);
  box-shadow:0 22px 60px rgba(124,92,255,.45)}
.hero .bigorb::after{content:"";position:absolute;inset:-14px;border-radius:50%;
  border:1.5px solid color-mix(in srgb,var(--brand) 55%,transparent);opacity:.5;
  animation:pulse 2.8s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.55}70%{transform:scale(1.18);opacity:0}100%{transform:scale(1.18);opacity:0}}
.hero .hello{font-size:15px;color:var(--muted);font-weight:550;margin-bottom:8px}
.hero .hello b{color:var(--ink)}
.hero h1{font-size:clamp(26px,4vw,36px);font-weight:750;letter-spacing:-1px;
  background:linear-gradient(120deg,#ffffff,color-mix(in srgb,var(--brand) 60%,#fff));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* quick action cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:46px 0 0;width:100%;max-width:820px}
.card{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:18px;padding:20px 18px;
  text-align:left;transition:.18s;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(140px 80px at 20% 0%,rgba(91,140,255,.16),transparent 70%);
  opacity:0;transition:.22s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--brand) 50%,var(--line));
  box-shadow:0 18px 44px rgba(0,0,0,.45)}
.card:hover::before{opacity:1}
.card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 30%,var(--panel2)),color-mix(in srgb,var(--brand2) 22%,var(--panel2)));
  border:1px solid var(--line)}
.card b{font-size:15px;font-weight:680}
.card small{font-size:12.5px;color:var(--muted);line-height:1.45}

/* conversation */
.chat{flex:1;width:100%;overflow-y:auto;padding:12px 0 6px;display:none}
.chat.show{display:block}
.chat::-webkit-scrollbar{width:8px}.chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.wrap{display:flex;margin:0 0 18px;animation:fade .25s;align-items:flex-start}
.wrap.user{justify-content:flex-end}
.wrap .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;margin-top:2px;display:grid;place-items:center;font-size:12px;font-weight:700}
.wrap.aira .av{background:var(--grad);color:#fff;margin-right:11px;box-shadow:0 6px 16px rgba(124,92,255,.4)}
.wrap.user .av{background:var(--panel2);color:var(--muted);margin-left:11px;border:1px solid var(--line)}
.bubble{max-width:78%;padding:13px 17px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.62}
.wrap.aira .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;
  box-shadow:0 4px 18px rgba(0,0,0,.3)}
.wrap.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 24px rgba(124,92,255,.35)}
.wrap.sys .bubble{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--warn);font-size:12.5px;max-width:92%}
.thinking{display:inline-flex;gap:5px;padding:6px 2px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
@keyframes blink{50%{opacity:.3}}

/* approval */
.approve{margin:6px 0;padding:15px 16px;border-radius:16px;max-width:88%;background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 32%,var(--line))}
.approve b{font-size:12px;color:var(--warn);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:6px}
.approve .q{font-size:13.5px;margin-bottom:12px;white-space:pre-wrap;color:var(--ink)}
.btns{display:flex;gap:9px}
.abtn{border-radius:9px;padding:8px 18px;font-size:12.5px;font-weight:650;color:#fff;transition:.15s}
.abtn:active{transform:scale(.97)}.abtn.ok{background:var(--ok)}.abtn.no{background:var(--no)}

/* ===== composer ===== */
.composer{width:100%;max-width:820px;margin:0 auto;padding:8px 0 16px}
.box{display:flex;align-items:center;gap:8px;padding:7px 7px 7px 20px;background:var(--panel);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;font-size:15px;line-height:1.5;padding:10px 0;max-height:140px;color:var(--ink)}
textarea::placeholder{color:var(--faint)}
.cbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:17px;color:var(--muted);flex-shrink:0;transition:.15s}
.cbtn:hover{background:var(--panel2)}
.cbtn.send{background:var(--grad);color:#fff;font-size:19px;box-shadow:0 8px 22px rgba(124,92,255,.4)}
.cbtn.send:hover{filter:brightness(1.1)}
.cbtn.mic.on{background:color-mix(in srgb,var(--no) 18%,transparent);color:var(--no);animation:micpulse 1.2s infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,123,123,.3)}50%{box-shadow:0 0 0 10px rgba(255,123,123,0)}}

/* footer */
footer{max-width:960px;width:100%;margin:0 auto;padding:10px 30px 24px;text-align:center;
  font-size:11.5px;color:var(--faint)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--ink)}

#liveStatus{position:fixed;right:22px;bottom:22px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);background:rgba(15,18,32,.8);padding:7px 12px;border-radius:99px;backdrop-filter:blur(6px)}
#liveStatus b{color:var(--ok)}

@media(max-width:860px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards{grid-template-columns:1fr}.card{flex-direction:row;align-items:center}
  .card small{-webkit-line-clamp:2}.badge{display:none}}
</style></head>
<body>

<header>
  <div class="orb"></div>
  <div class="brand"><b>Aira</b><span>AI Assistant</span></div>
  <div class="spacer"></div>
  <div class="badge" id="statusbadge"><b id="statusdot">●</b>&nbsp; <span id="statustext">Online</span></div>
</header>

<main>
  <section class="chat" id="chat"></section>

  <section class="hero" id="hero">
    <div class="bigorb"></div>
    <div class="hello">Hi Rohit, I'm <b>Aira</b>, your AI assistant.</div>
    <h1>How can I help you today?</h1>

    <div class="cards" id="cards">
      <button class="card" data-p="Write a cold email to a client" data-i="✍️" data-t="Write">
        <span class="ic">✍️</span><b>Write anything</b><small>Emails, blogs, essays &amp; more</small>
      </button>
      <button class="card" data-p="Explain machine learning simply" data-i="💡" data-t="Explain">
        <span class="ic">💡</span><b>Explain anything</b><small>Get simple explanations</small>
      </button>
      <button class="card" data-p="Write a Python script to rename files in a folder" data-i="⌨️" data-t="Code">
        <span class="ic">⌨️</span><b>Code with Aira</b><small>Python, JS, HTML &amp; more</small>
      </button>
      <button class="card" data-p="Summarize the latest AI agent news for me" data-i="📄" data-t="Summarize">
        <span class="ic">📄</span><b>Summarize</b><small>Articles, PDFs, notes &amp; more</small>
      </button>
    </div>
  </section>

  <div class="composer"><div class="box">
    <textarea id="prompt" rows="1" placeholder="Ask me anything..." autofocus></textarea>
    <button class="cbtn mic" id="mic" title="Speak to Aira">🎙</button>
    <button class="cbtn send" id="send" title="Send">↑</button>
  </div></div>
</main>

<footer>Aira respects your privacy. <a href="#" onclick="return false">Learn more</a></footer>
<div id="liveStatus"><b>●</b> <span>online</span></div>

<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('prompt'),hero=$('hero');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* fill + send from cards */
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
  inp.value=c.dataset.p; send(); }));

/* bubbles */
function bubble(text,cls){
  if(hero)hero.remove(); if(!chat.classList.contains('show'))chat.classList.add('show');
  const wrap=document.createElement('div');wrap.className='wrap '+cls;
  const av=cls==='user'?'<div class="av">YOU</div>':cls==='aira'?'<div class="av">A</div>':'';
  wrap.innerHTML=cls==='user'?av+'<div class="bubble"></div>':'<div class="bubble"></div>'+av;
  wrap.querySelector('.bubble').textContent=text;
  chat.appendChild(wrap);scroll();return wrap;
}
function thinking(){const w=document.createElement('div');w.className='wrap aira';
  w.innerHTML='<div class="av">A</div><div class="bubble"><span class="thinking"><i></i><i></i><i></i></span></div>';
  chat.appendChild(w);scroll();return w.querySelector('.bubble');
}
function scroll(){chat.scrollTop=chat.scrollHeight}
function setStatus(state,msg){
  const d=$('statusdot'),t=$('statustext'),ls=$('liveStatus');
  d.style.color=state==='thinking'?'var(--warn)':state.startsWith('acting')?'var(--brand)':'var(--ok)';
  t.textContent=msg;
  ls.querySelector('span').textContent=msg;
  ls.querySelector('b').style.color=d.style.color;
  if(state==='thinking')ls.querySelector('span').textContent='Thinking…';
}

async function send(){
  const t=inp.value.trim(); if(!t)return; inp.value=''; autosize();
  bubble(t,'user'); const b=thinking(); setStatus('thinking','Thinking…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
    const j=await r.json(); b.textContent=j.reply||'No reply.';
  }catch(e){ b.textContent='Aira is offline — is the server running?'; }
  setStatus('idle','Online'); scroll(); checkPending();
}

/* approvals */
async function checkPending(){
  try{const r=await fetch('/api/pending');const j=await r.json();
    const old=document.querySelector('.approve');if(old)old.remove();
    if(j.question){const d=document.createElement('div');d.className='approve';
      d.innerHTML='<b>Approval needed</b><div class="q">'+esc(j.question)+'</div>'+
      '<div class="btns"><button class="abtn ok" onclick="answer(1)">✓ Approve</button>'+
      '<button class="abtn no" onclick="answer(0)">✕ Deny</button></div>';
      chat.appendChild(d);scroll();}
  }catch(e){}
}
async function answer(v){await fetch('/api/pending',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approve:!!v})});load();}

/* history */
async function load(){
  try{const r=await fetch('/api/history');const h=(await r.json()).history||[];
    const list=h.filter(m=>m.role!=='system'); if(!list.length)return;
    if(hero)hero.remove();
    chat.querySelectorAll('.wrap').forEach(n=>n.remove()); chat.classList.add('show');
    list.forEach(m=>bubble(m.content,m.role==='user'?'user':'aira'));
  }catch(e){} checkPending();
}

/* status polling */
async function pollStatus(){
  try{const j=await (await fetch('/api/status')).json();const s=j.state||'idle';
    if(s==='thinking')setStatus('thinking','Thinking…');
    else if(s.startsWith('acting'))setStatus('acting','⚙ '+s.replace('acting:','').trim()+'…');
    else if(s==='idle')setStatus('idle','Online');
  }catch(e){setStatus('idle','Offline');}
}

/* textarea */
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'}
inp.addEventListener('input',autosize);
$('send').onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

/* voice out (spoken replies) — optional, off by default to stay quiet */
let voiceOn=localStorage.getItem('airaVoice')==='1';
function speak(text){if(!voiceOn||!('speechSynthesis' in window)||!text)return;
  speechSynthesis.cancel();
  const clean=text.replace(/```[\s\S]*?```/g,' ').replace(/[#*_>`~]/g,' ').replace(/\s+/g,' ').trim();
  if(!clean)return;const u=new SpeechSynthesisUtterance(clean);u.pitch=1;u.rate=1.02;u.lang='en-IN';
  const vs=speechSynthesis.getVoices().filter(v=>/en(-|_)?(IN|GB)/i.test(v.lang));if(vs.length)u.voice=vs[0];
  speechSynthesis.speak(u);}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
setInterval(()=>{const bb=document.querySelector('.wrap.aira .bubble');
  if(voiceOn&&bb&&!bb.dataset.said){bb.dataset.said='1';speak(bb.textContent)}},1200);

/* voice in (browser mic -> text) */
const mic=$('mic');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.lang='en-IN';rec.interimResults=true;let listening=false;
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;inp.value=t;autosize()};
  rec.onend=()=>{mic.classList.remove('on');listening=false;if(inp.value.trim())send()};
  rec.onerror=()=>{mic.classList.remove('on');listening=false};
  mic.onclick=()=>{if(listening){rec.stop();mic.classList.remove('on');return}
    try{rec.start();mic.classList.add('on');listening=true}catch(e){}};
}else mic.style.display='none';

load();pollStatus();
setInterval(pollStatus,900);setInterval(checkPending,1200);
</script>
</body></html>
