name: Deploy Aira web UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python backend compiles
        run: |
          chmod +x setup.sh 2>/dev/null || true
          python3 -m py_compile aira/webui.py aira/productivity.py aira/main.py aira/executor.py aira/brain.py
          echo "Backend compiles OK"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage static web UI
        run: |
          mkdir -p _site
          cp aira/webui_page.html _site/index.html
          cp -r assets _site/assets 2>/dev/null || true
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4