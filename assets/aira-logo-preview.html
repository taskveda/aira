<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aira — logo preview</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(120% 120% at 50% 10%, #0b1020 0%, #05060d 60%, #000 100%);
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { text-align:center; }
  svg { width: min(72vmin, 420px); height:auto; display:block; margin:0 auto;
        filter: drop-shadow(0 18px 60px rgba(120, 60, 255, .35)); }
  .hint { margin-top:18px; color:#8b93b5; font-size:13px; letter-spacing:.4em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="aira-logo.svg" alt="Aira logo">
    <div class="hint">Aira</div>
  </div>
</body>
</html>
